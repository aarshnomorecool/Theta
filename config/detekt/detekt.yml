# Layered on detekt's defaults (buildUponDefaultConfig). Only deviations are listed here.

complexity:
  LongParameterList:
    # Composables hoist state and Hilt supplies @Inject constructors, so long lists are not a design smell there.
    ignoreAnnotated: ['Composable', 'Inject']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # DAOs and repositories are flat collections of small operations.
    ignoreAnnotatedFunctions: ['Composable', 'Preview']
    thresholdInInterfaces: 20
    thresholdInClasses: 20
    thresholdInFiles: 20
    thresholdInObjects: 20

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

style:
  ReturnCount:
    # Parsers read best as a run of early exits.
    max: 5
    excludeGuardClauses: true
  MagicNumber:
    # Tests and generated theme tokens are full of meaningful literals.
    excludes: ['**/test/**', '**/androidTest/**', '**/*Theme.kt', '**/*Color.kt']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreEnums: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

exceptions:
  TooGenericExceptionCaught:
    # Project rule: failures at third-party SDK boundaries must become results, not crashes. Those
    # SDKs do not document what they throw, so a broad catch is the correct tool at that boundary.
    excludes: ['**/test/**', '**/androidTest/**']
    allowedExceptionNameRegex: '_|(ignore|expected).*'

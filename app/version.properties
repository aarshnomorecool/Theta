# The app version. Change only versionName before a release (see docs/RELEASING.md); versionCode is derived from it
# as major * 10000 + minor * 100 + patch, so 0.2.0 is 200 and 1.4.12 is 10412. Stores refuse an upload whose
# versionCode is not higher than the last one, which this scheme guarantees as long as versions only go up.
versionName=0.2.0

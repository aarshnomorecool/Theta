name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.THETA_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "THETA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json

      - name: Build signed bundle
        env:
          THETA_KEYSTORE_PASSWORD: ${{ secrets.THETA_KEYSTORE_PASSWORD }}
          THETA_KEY_ALIAS: ${{ secrets.THETA_KEY_ALIAS }}
          THETA_KEY_PASSWORD: ${{ secrets.THETA_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE_NEW_TAB_ID: ${{ secrets.ADMOB_NATIVE_NEW_TAB_ID }}
          ADMOB_NATIVE_DOWNLOADS_ID: ${{ secrets.ADMOB_NATIVE_DOWNLOADS_ID }}
          ADMOB_NATIVE_BOOKMARKS_ID: ${{ secrets.ADMOB_NATIVE_BOOKMARKS_ID }}
          ADMOB_NATIVE_HISTORY_ID: ${{ secrets.ADMOB_NATIVE_HISTORY_ID }}
        run: ./gradlew bundleRelease

      # Pinned to a commit because this third-party action handles the Play service account key.
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.seasaw.browser
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
